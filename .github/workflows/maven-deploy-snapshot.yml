name: Maven Deploy Snapshot
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          overwrite-settings: false

      # Central snapshots are not signed, so no GPG key is needed here. Only
      # iec60870-core, iec60870-cs104, iec60870-application, and
      # iec60870-transport-tcp are published; the other modules skip the deploy
      # plugin in their POMs.
      - name: Publish snapshot
        run: mvn -B --settings .github/maven-settings.xml clean deploy -P deploy-snapshot
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
